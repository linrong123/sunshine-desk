<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Shared canvas coordinates also make the cursor separator seamless. -->
    <linearGradient id="background" x1="100" y1="100" x2="924" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#326BEA"/>
      <stop offset="1" stop-color="#4332A9"/>
    </linearGradient>
  </defs>

  <!-- 824 px tile; 100 px transparent margin; 185 px corner radius. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#background)"/>

  <!-- Family monitor: identical geometry in both app icons. -->
  <path fill="#FFFFFF" fill-rule="evenodd" d="
    M294 326 H654 Q694 326 694 366 V588 Q694 628 654 628
    H294 Q254 628 254 588 V366 Q254 326 294 326 Z
    M300 362 Q290 362 290 372 V570 Q290 580 300 580
    H648 Q658 580 658 570 V372 Q658 362 648 362 Z"/>
  <path fill="#FFFFFF" d="M442 628 H506 V680 H442 Z"/>
  <rect x="382" y="676" width="184" height="36" rx="18" fill="#FFFFFF"/>

  <!-- A single pointer, separated from the monitor by the tile gradient. -->
  <path fill="#FFFFFF" stroke="url(#background)" stroke-width="24" stroke-linejoin="round" d="
    M594 484 L594 718 L650 666 L696 752 L738 728
    L692 644 L766 628 Z"/>
</svg>
